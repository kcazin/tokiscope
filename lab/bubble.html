<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The bubble</title>
<link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400&family=Schibsted+Grotesk:wght@400;500&display=swap" rel="stylesheet">
<link href="bubble.css" rel="stylesheet">
<style>
  /* The bubbles side by side over a wallpaper (click one to open it), then what they can open into shown open: the
     cards and the layouts worth comparing. ?b=<bubble>&open=<card:key|layout> shows one alone on a transparent page,
     pinned to the bottom right, for the app (&app=1); ?relay=demo makes agents up. */
  body { margin: 0; min-height: 100vh; color: #e8e8e8; font: 400 .875rem/1.5 "Schibsted Grotesk", system-ui, "Hiragino Sans", "Hiragino Kaku Gothic ProN", sans-serif;
    background: #222 url(torii.jpg) center / cover fixed; }
  h1 { margin: 0; padding: 2rem 2.5rem 0; font-size: 1rem; font-weight: 500; text-shadow: 0 1px 6px #000; }
  .intro { margin: .25rem 2.5rem 0; max-width: 46rem; font-size: .8125rem; color: #ddd; text-shadow: 0 1px 6px #000; }
  .intro a { color: inherit; }
  h2 { margin: 0; padding: 1.75rem 2.5rem 0; font-size: .9375rem; font-weight: 500; text-shadow: 0 1px 6px #000; }
  h2 + p { margin: .15rem 2.5rem 0; font-size: .8125rem; color: #d0d0d0; text-shadow: 0 1px 6px #000; }
  .controls { position: absolute; top: 1.9rem; right: 2.5rem; display: flex; gap: 1rem; font-size: .8125rem; text-shadow: 0 1px 6px #000; }
  .controls select { font: inherit; background: rgb(0 0 0 / .5); color: inherit; border: 1px solid rgb(255 255 255 / .2); border-radius: 4px; }
  main { display: flex; flex-wrap: wrap; gap: 1.5rem; padding: 1.5rem 2.5rem; }
  figure { margin: 0; }
  .stage { position: relative; width: 420px; height: 240px; border-radius: 12px; outline: 1px dashed rgb(255 255 255 / .15); }
  figcaption { margin-top: .5rem; text-shadow: 0 1px 6px #000; max-width: 420px; }
  figcaption b { font-weight: 500; }
  figcaption span { display: block; color: #c4c4c4; font: 400 .75rem/1.45 "Geist Mono", ui-monospace, monospace; }

  html.one, html.one body { background: transparent; }
  html.one body { height: 100vh; overflow: hidden; }
</style>
</head>
<body>
<script type="module">
  import { bubble, BUBBLES, CARDS, isCard } from './bubble.js';
  import { MACHINES } from './lab.js';
  import { setKinds } from './flow.js';
  import { setScene } from './scene.js';
  const q = new URLSearchParams(location.search), one = q.get('b');
  const open = isCard(q.get('open')) || MACHINES[q.get('open')] ? q.get('open') : 'haul';
  if (one && BUBBLES[one]) {
    document.documentElement.classList.add('one');
    // For the app: it pins the bubble to a corner, hovers and toggles it, and changes what shows in place (`set`), so
    // the stats so far stay instead of the page loading again.
    let style = one, what = open, corner = [false, false], b;
    const make = wasOpen => { b = bubble(document.body, { style, open: what, app: q.has('app'), pin: wasOpen ? 'open' : null }); b.anchor(...corner); };
    make(false);
    window.bubble = {
      hover: on => b.hover(on), toggle: () => b.toggle(),
      anchor(t, l) { corner = [t, l]; b.anchor(t, l); },
      set({ b: s, open: o, kinds, scene }) {
        if (kinds) setKinds(kinds);
        if (scene) setScene(scene);
        if ((s && BUBBLES[s] && s !== style) || (o && o !== what && (isCard(o) || MACHINES[o]))) {
          const wasOpen = b.isOpen;
          style = BUBBLES[s] ? s : style; what = isCard(o) || MACHINES[o] ? o : what;
          b.stop(); make(wasOpen);
        }
      },
    };
  } else {
    // What a bubble opens into, shown open: the cards on the bubble each goes best with, and the layouts worth comparing.
    const PAIR = { classic: 'orb', speed: 'tach', agents: 'quake' }, FIELDS = ['haulflow', 'dash', 'haul'];
    const fig = (data, size, title, url, note) => `<figure style="width:${size[0]}px"><div class="stage" ${data} style="width:${size[0]}px;height:${size[1]}px"></div>
      <figcaption><b>${title}</b><span>${url}</span><span>${note}</span></figcaption></figure>`;
    const options = [...Object.entries(CARDS).map(([k, c]) => ['card:' + k, c.name]), ...Object.entries(MACHINES).map(([k, m]) => [k, m.name])];
    const demo = q.get('relay') === 'demo';
    document.body.innerHTML = `<h1>The bubble</h1>
      <p class="intro">A bubble floats in a corner. Click it to open it into a card or a layout, click again to close it.
        ${demo ? 'Made-up agents — <a href="?">follow the relay</a>.' : '<a href="?relay=demo">Made-up agents</a> to see them move when nobody is working.'}</p>
      <div class="controls"><label>Opens into <select id="open">${options.map(([k, n]) => `<option value="${k}"${k === open ? ' selected' : ''}>${n}</option>`).join('')}</select></label></div>
      <h2>Bubbles</h2><p>Click one to open it into what is picked at the top right.</p>
      <main>${Object.entries(BUBBLES).map(([k, b]) => fig(`data-b="${k}"`, [360, 250], b.name, `?b=${k}`, b.note)).join('')}</main>
      <h2>Cards</h2><p>Shown open, each on the bubble it goes best with.</p>
      <main>${Object.entries(CARDS).map(([k, c]) => fig(`data-card="${k}"`, [300, 300], c.name, `?open=card:${k}`, c.note)).join('')}</main>
      <h2>Layouts</h2><p>Shown open; click one to close it to its bubble. Any layout can be what a bubble opens into.</p>
      <main>${FIELDS.map(k => fig(`data-art="${k}"`, MACHINES[k].size().map(v => v + 48), MACHINES[k].name, `?open=${k}`, MACHINES[k].note)).join('')}</main>`;
    document.getElementById('open').addEventListener('change', e => { q.set('open', e.target.value); location.search = q; });
    for (const el of document.querySelectorAll('[data-b]')) bubble(el, { style: el.dataset.b, open });
    for (const el of document.querySelectorAll('[data-card]')) bubble(el, { style: PAIR[el.dataset.card], open: 'card:' + el.dataset.card, pin: 'open' });
    for (const el of document.querySelectorAll('[data-art]')) bubble(el, { style: 'tach', open: el.dataset.art, pin: 'open' });
  }
</script>
</body>
</html>
