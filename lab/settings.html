<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tokiscope Settings</title>
<link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400&family=Schibsted+Grotesk:wght@400;500&display=swap" rel="stylesheet">
<link href="bubble.css" rel="stylesheet">
<style>
  /* The app's settings window, in three tabs. Look: every bubble, card and layout running live, the ones in use
     outlined (clicking one uses it), with the size, the tokens counted and the window's options. Machines: the fleet.
     General: login, updates, where the pages and stats come from. The app is told what was picked or asked for through
     `pick` ({ kind, key }; kind "do" for an action), and tells the page its whole state through window.settings.set.
     In a browser it only previews the Look tab. ?mode=widget|bubble&b=<bubble>&card=<card>&layout=<layout>
     &kinds=<in,cr,cw,out>&scene=<city>&tab=look|machines|general says what is in use. */
  :root { --accent: #e2502b; }
  body { margin: 0; color: #e8e8e8; font: 400 .8125rem/1.45 "Schibsted Grotesk", system-ui, sans-serif; background: #141414;
    -webkit-user-select: none; user-select: none; }
  header { position: sticky; top: 0; z-index: 2; display: flex; align-items: center; gap: 1.2rem; padding: 2.4rem 1.75rem .9rem;
    background: #141414; box-shadow: 0 1px 0 rgb(255 255 255 / .06); }
  h1 { margin: 0; font-size: 1rem; font-weight: 500; }
  main { display: none; padding-bottom: 1.5rem; }
  main.on { display: block; }
  .rows { padding: .6rem 0 .4rem; }
  .row { display: flex; align-items: center; gap: 1rem; padding: .4rem 1.75rem; min-height: 1.9rem; }
  .row > b { flex: 0 0 8.5rem; font-weight: 400; color: #9a9a9a; }
  .row .hint { color: #6f6f6f; }
  .row code, .item code { font: .75rem "Geist Mono", ui-monospace, monospace; color: #bdbdbd; }
  .btn { font: inherit; color: #e8e8e8; background: #2a2a2a; border: 0; padding: .3rem .85rem; border-radius: 6px; cursor: pointer;
    box-shadow: inset 0 0 0 1px rgb(255 255 255 / .08); white-space: nowrap; }
  .btn:hover { background: #333; }
  .btn.primary { background: #3a2a25; box-shadow: inset 0 0 0 1px var(--accent); }
  .btn:disabled { opacity: .45; cursor: default; }
  .switch { position: relative; width: 2.1rem; height: 1.2rem; padding: 0; border: 0; border-radius: 999px; background: #3a3a3a; cursor: pointer; flex: none; }
  .switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: calc(1.2rem - 4px); height: calc(1.2rem - 4px); border-radius: 50%;
    background: #d8d8d8; transition: transform .15s ease; }
  .switch.on { background: var(--accent); }
  .switch.on::after { transform: translateX(.9rem); background: #fff; }
  .list { margin: .5rem 1.75rem; border-radius: 10px; background: #1b1b1b; box-shadow: inset 0 0 0 1px rgb(255 255 255 / .05); overflow: hidden; }
  .item { display: flex; align-items: center; gap: .7rem; padding: .6rem .9rem; }
  .item + .item { border-top: 1px solid rgb(255 255 255 / .05); }
  .item .name { flex: none; }
  .item .meta { flex: 1; color: #7a7a7a; }
  .item .tag { color: #7a7a7a; }
  .dot { flex: none; width: 8px; height: 8px; border-radius: 50%; background: #4a4a4a; }
  .dot.online { background: #3ec26b; }
  .dot.removed { background: #e2502b; }
  .problem { display: flex; align-items: center; gap: 1rem; margin: .8rem 1.75rem 0; padding: .7rem .9rem; border-radius: 10px;
    background: #2a1d17; box-shadow: inset 0 0 0 1px rgb(226 80 43 / .5); }
  .problem span { flex: 1; }
  .actions { display: flex; gap: .6rem; padding: .5rem 1.75rem; }
  .note { margin: 1rem 1.75rem; color: #8a8a8a; }
  .seg { display: inline-flex; padding: 2px; border-radius: 8px; background: #232323; box-shadow: inset 0 0 0 1px rgb(255 255 255 / .06); }
  .seg button { font: inherit; color: #bdbdbd; background: none; border: 0; padding: .3rem .9rem; border-radius: 6px; cursor: pointer; }
  .seg button.on { color: #fff; background: #3a3a3a; }
  select { font: inherit; color: #e8e8e8; background: #2a2a2a; border: 0; padding: .3rem .6rem; border-radius: 6px; cursor: pointer;
    box-shadow: inset 0 0 0 1px rgb(255 255 255 / .08); }
  .kinds { display: inline-flex; align-items: center; gap: .35rem; color: #8a8a8a; }
  .kinds button { font: inherit; color: #9a9a9a; background: #1d1d1d; border: 0; padding: .25rem .6rem; border-radius: 999px; cursor: pointer;
    box-shadow: inset 0 0 0 1px rgb(255 255 255 / .08); }
  .kinds button.on { color: #fff; background: #3a2a25; box-shadow: inset 0 0 0 1px var(--accent); }
  h2 { margin: 0; padding: 1.1rem 1.75rem .15rem; font-size: .875rem; font-weight: 500; }
  h2 + p { margin: 0 1.75rem; color: #8a8a8a; }
  h3 { margin: 0; padding: .9rem 1.75rem 0; font-size: .75rem; font-weight: 500; color: #9a9a9a; text-transform: uppercase; letter-spacing: .04em; }
  .grid { display: flex; flex-wrap: wrap; align-items: flex-end; gap: .9rem; padding: .7rem 1.75rem .4rem; }
  .tile { display: flex; flex-direction: column; align-items: center; gap: .4rem; padding: 8px; border: 0; border-radius: 12px;
    background: #1b1b1b; color: inherit; font: inherit; cursor: pointer; box-shadow: inset 0 0 0 1px rgb(255 255 255 / .05);
    transition: box-shadow .15s ease, background .15s ease; }
  .tile:hover { background: #222; box-shadow: inset 0 0 0 1px rgb(255 255 255 / .14); }
  .tile.on { box-shadow: inset 0 0 0 2px var(--accent); background: #211a18; }
  .tile span { color: #cfcfcf; }
  .tile.on span { color: #fff; }
  .tile span i { font-style: normal; color: var(--accent); }
  .pv { position: relative; pointer-events: none; overflow: hidden; text-align: left; }
  .pv > .in { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
  .field { padding: 10px; border-radius: 12px; background: #0e0e0e; box-shadow: 0 0 0 1px rgb(255 255 255 / .06); }
  body.widget .bubble-only { display: none; }
  body.bubble .widget-only { display: none; }
  footer { padding: 1.2rem 1.75rem 1.75rem; color: #6f6f6f; }
</style>
</head>
<body>
<script type="module">
  import { bubble, BUBBLES, CARDS } from './bubble.js';
  import { run, MACHINES } from './lab.js';
  import { setKinds } from './flow.js';
  import { CITIES, cityOf, setScene } from './scene.js';
  const q = new URLSearchParams(location.search);
  const state = { mode: q.get('mode') === 'widget' ? 'widget' : 'bubble', b: q.get('b') || 'orb', card: q.get('card') || 'classic', layout: q.get('layout') || 'haul',
    kinds: (q.get('kinds') || 'in,cr,cw,out').split(','), scene: q.get('scene') || 'auto', tab: q.get('tab') || 'look',
    zoom: 0, zooms: ['Small', 'Medium', 'Large'], desktop: false, glass: true, clickThrough: true };
  const KINDS = [['in', 'Input'], ['cr', 'Cache read'], ['cw', 'Cache write'], ['out', 'Output']];
  const PAIR = { classic: 'orb', speed: 'tach', agents: 'quake' };      // the bubble each card shows on
  const GROUPS = [['With the trucks', m => m.trucks], ['Throughput', m => m.flow && !m.trucks], ['Machines', m => !m.trucks && !m.flow]];
  const TABS = [['look', 'Look'], ['machines', 'Machines'], ['general', 'General']];
  const app = !!window.webkit?.messageHandlers?.pick;
  const send = (kind, key = '') => window.webkit?.messageHandlers?.pick?.postMessage({ kind, key: String(key) });
  const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const tile = (kind, key, name, w, h) => `<button class="tile" data-kind="${kind}" data-key="${key}"><div class="pv" style="width:${w}px;height:${h}px"><div class="in"></div></div><span>${name}</span></button>`;
  const seg = (set, items) => `<div class="seg">${items.map(([key, name]) => `<button data-set="${set}" data-key="${key}">${name}</button>`).join('')}</div>`;
  const toggle = flag => `<button class="switch" data-flag="${flag}" aria-label="${flag}"></button>`;
  document.body.innerHTML = `<header><h1>Tokiscope</h1>${app ? `<div class="seg tabs">${TABS.map(([k, name]) => `<button data-tab="${k}">${name}</button>`).join('')}</div>` : ''}</header>
    <main data-tab="look">
      <div class="rows">
        <div class="row"><b>Show as</b>${seg('mode', [['widget', 'Widget'], ['bubble', 'Bubble']])}</div>
        <div class="row"><b>Size</b><span id="zooms"></span></div>
        <div class="row"><b>Count</b><div class="kinds">${KINDS.map(([k, name]) => `<button data-k="${k}">${name}</button>`).join('')}</div></div>
        <div class="row"><b>Backdrop</b><select id="scene"><option value="auto">Where you are: ${esc(cityOf().name)}</option>
          ${Object.values(CITIES).sort((a, b) => a.name.localeCompare(b.name)).map(c => `<option value="${c.key}">${esc(c.name)}</option>`).join('')}
          <option value="off">None</option></select><span class="hint">Behind the trucks, under the sky there now.</span></div>
        <div class="row"><b>Sits</b>${seg('desktop', [['0', 'Above windows'], ['1', 'On the desktop']])}</div>
        <div class="row widget-only"><b>Dark glass</b>${toggle('glass')}<span class="hint">A dark background behind the layout.</span></div>
        <div class="row widget-only"><b>Click through</b>${toggle('clickThrough')}<span class="hint">Clicks go to what's under the widget; hold ⌃ and click it for its menu.</span></div>
      </div>
      <section class="bubble-only"><h2>Bubble</h2><p>What floats in the corner. All live: click one to use it.</p>
        <div class="grid">${Object.entries(BUBBLES).map(([k, b]) => tile('bubble', k, b.name, 84, 84)).join('')}</div></section>
      <section class="bubble-only"><h2>Card on hover</h2><p>What shows beside the bubble while the pointer is over it.</p>
        <div class="grid">${Object.entries(CARDS).map(([k, c]) => tile('card', k, c.name, 275, 240)).join('')}</div></section>
      <section><h2 id="lt"></h2><p id="lp"></p>
        ${GROUPS.map(([title, of]) => `<h3>${title}</h3><div class="grid">${Object.entries(MACHINES).filter(([, m]) => of(m))
          .map(([k, m]) => tile('layout', k, m.name, 0, 0)).join('')}</div>`).join('')}</section>
      <footer>The tokens counted change the rates, meters, odometers, traces and rain; the trucks carry them all.</footer>
    </main>
    <main data-tab="machines"></main>
    <main data-tab="general"></main>`;

  // The bubbles alone, the cards held open on the bubble each goes with (at 0.8), the layouts as they show (scaled to fit).
  for (const el of document.querySelectorAll('[data-kind=bubble] .in')) { el.style.cssText += 'width:84px;height:84px'; bubble(el, { style: el.closest('.tile').dataset.key, art: null }); }
  for (const el of document.querySelectorAll('[data-kind=card] .in')) {
    el.style.cssText += 'width:344px;height:300px;transform:scale(.8)';
    const k = el.closest('.tile').dataset.key;
    bubble(el, { style: PAIR[k], card: k, art: null, pin: 'card' });
  }
  const fields = [...document.querySelectorAll('[data-kind=layout] .in')];
  for (const el of fields) el.innerHTML = '<div class="field"><div></div></div>';
  const fit = () => {
    for (const el of fields) {
      const [w, h] = MACHINES[el.closest('.tile').dataset.key].size(), s = Math.min(1, 280 / (w + 20));
      el.style.transform = `scale(${s})`;
      Object.assign(el.parentElement.style, { width: Math.round((w + 20) * s) + 'px', height: Math.round((h + 20) * s) + 'px' });
    }
  };
  run(fields.map(el => [el.querySelector('.field > div'), el.closest('.tile').dataset.key]), [], fit);
  fit();

  // The fleet, from the app: what needs doing, join requests, the machines, adding one.
  const machines = st => {
    if (!st) return `<p class="note">agent-stats isn't part of this copy of Tokiscope.</p>`;
    const off = st.busy ? ' disabled' : '';
    let h = st.busy ? `<p class="note">${esc(st.busy)}</p>` : '';
    for (const p of st.problems || []) h += `<div class="problem"><span>${esc(p.text)}</span><button class="btn primary" data-do="${p.do}"${off}>${esc(p.button)}</button></div>`;
    if (st.canSetUp) {
      return h + `<h2>Set up this Mac</h2><p>Join your fleet, or start one, so this Mac counts its agents and keeps everyone's stats.</p>
        <div class="actions"><button class="btn primary" data-do="setUp"${off}>Set Up This Mac…</button></div>`;
    }
    if (st.requests?.length) {
      h += `<h2>Asking to join</h2><p>Approve only a machine you set up yourself, after checking it shows the same code.</p><div class="list">${st.requests.map(r =>
        `<div class="item"><span class="name">${esc(r.who)}</span><span class="meta">code <code>${esc(r.digits)}</code></span><button class="btn primary" data-request="${esc(r.id)}"${off}>Review…</button></div>`).join('')}</div>`;
    }
    h += `<h2>Machines</h2><p>Every Mac with Tokiscope keeps the whole fleet's stats; other machines report to them.</p>`;
    if (st.machines) {
      h += st.machines.length ? `<div class="list">${st.machines.map(m => `<div class="item">
          <span class="dot ${m.revoked ? 'removed' : m.online ? 'online' : ''}"></span>
          <span class="name">${esc(m.name)}${m.self ? ' <span class="tag">(this Mac)</span>' : ''}</span>
          <span class="meta">${m.revoked ? 'Removed' : `${m.online ? 'Online' : 'Offline'} · ${m.replica ? 'keeps the stats' : 'reports'}${m.version ? ` · agent-stats ${esc(m.version)}` : ''}`}</span>
          ${!m.revoked && !m.self ? `<button class="btn" data-remove="${esc(m.machine)}"${off}>Remove…</button>` : ''}</div>`).join('')}</div>`
        : `<p class="note">Looking…</p>`;
    }
    h += `<div class="actions"><button class="btn primary" data-do="addMachine"${off}>Add Machine…</button>${st.dashboard ? `<button class="btn" data-do="dashboard">${esc(st.dashboard)}</button>` : ''}</div>`;
    return h + `<footer>${esc(st.summary)}</footer>`;
  };
  const general = s => `<div class="rows">
      <div class="row"><b>Open at login</b><button class="switch${s.login ? ' on' : ''}" data-do="login" aria-label="Open at login"></button></div>
      <div class="row"><b>Updates</b>${s.updates ? '<button class="btn" data-do="updates">Check for Updates…</button>' : '<span class="hint">This build doesn\'t update itself.</span>'}
        ${s.version ? `<span class="hint">Tokiscope ${esc(s.version)}</span>` : ''}</div>
    </div>
    <h2>Advanced</h2><p>Where the pages and the stats come from.</p>
    <div class="rows">
      <div class="row"><b>Pages from</b>${seg('site', (s.sites || []).map((name, i) => [i, esc(name)]))}</div>
      <div class="row"><b>Page</b>${s.pageURL ? `<code>${esc(s.pageURL)}</code>` : '<span class="hint">The layout</span>'}<button class="btn" data-do="pageURL">Other Page URL…</button></div>
      <div class="row"><b>Stats relay</b>${s.relay ? `<code>${esc(s.relay)}</code>` : '<span class="hint">None</span>'}<button class="btn" data-do="relay">Change…</button></div>
      <div class="row"><b>Stats</b><span class="hint">${esc(s.source)}</span></div>
      <div class="row"><b></b><button class="btn" data-do="reload">Reload the Widget</button></div>
    </div>`;

  // What is in use, from the app.
  let shown = {};                                        // the HTML last put in, to rebuild only what changed
  const key = v => v === true ? '1' : v === false ? '0' : String(v);   // a setting as its buttons' data-key
  window.settings = {
    set(s) {
      Object.assign(state, s);
      document.body.className = state.mode;
      for (const m of document.querySelectorAll('main')) m.classList.toggle('on', m.dataset.tab === state.tab);
      for (const b of document.querySelectorAll('[data-tab]')) if (b.tagName === 'BUTTON') b.classList.toggle('on', b.dataset.tab === state.tab);
      const z = seg('zoom', state.zooms.map((name, i) => [i, name]));
      if (z !== shown.z) document.getElementById('zooms').innerHTML = shown.z = z;
      for (const b of document.querySelectorAll('[data-set]')) b.classList.toggle('on', key(state[b.dataset.set]) === b.dataset.key);
      for (const b of document.querySelectorAll('[data-flag]')) b.classList.toggle('on', !!state[b.dataset.flag]);
      for (const b of document.querySelectorAll('.kinds button')) b.classList.toggle('on', state.kinds.includes(b.dataset.k));
      if (s.kinds) setKinds(state.kinds);
      if (s.scene) { setScene(state.scene); document.getElementById('scene').value = state.scene; }
      for (const t of document.querySelectorAll('.tile')) t.classList.toggle('on', state[{ bubble: 'b', card: 'card', layout: 'layout' }[t.dataset.kind]] === t.dataset.key);
      document.getElementById('lt').textContent = state.mode === 'bubble' ? 'Opens on click' : 'Layout';
      document.getElementById('lp').textContent = state.mode === 'bubble' ? 'What the bubble opens into when clicked.' : 'What sits on the desktop. All live: click one to use it.';
      // The other tabs are rebuilt only when what they show changed (a rebuild under the pointer would lose a hover).
      const m = machines(state.stats), g = general(state);
      if (m !== shown.m) document.querySelector('main[data-tab=machines]').innerHTML = shown.m = m;
      if (g !== shown.g) { document.querySelector('main[data-tab=general]').innerHTML = shown.g = g; window.settings.set({}); }
    },
  };
  const pick = (kind, key) => {
    send(kind, key);
    window.settings.set(kind === 'mode' ? { mode: key } : kind === 'bubble' ? { b: key, mode: 'bubble' } : { [kind]: key });
  };
  document.addEventListener('click', e => {
    const b = e.target.closest('button');
    if (!b || b.disabled) return;
    const d = b.dataset;
    if (d.tab) window.settings.set({ tab: d.tab });
    else if (d.set) pick(d.set, d.key);
    else if (d.flag) { const on = !state[d.flag]; send(d.flag, on ? 1 : 0); window.settings.set({ [d.flag]: on }); }
    else if (d.do) send('do', d.do);
    else if (d.remove) send('remove', d.remove);
    else if (d.request) send('request', d.request);
    else if (d.kind) pick(d.kind, d.key);
    else if (d.k) {
      // The tokens counted: any of the four, never none.
      const k = d.k, on = state.kinds.includes(k), next = KINDS.map(([x]) => x).filter(x => x === k ? !on : state.kinds.includes(x));
      if (!next.length) return;
      send('kinds', next.join());
      window.settings.set({ kinds: next });
    }
  });
  document.getElementById('scene').addEventListener('change', e => pick('scene', e.target.value));
  window.settings.set({ scene: state.scene });
  send('ready');                                         // the app answers with everything else
</script>
</body>
</html>
